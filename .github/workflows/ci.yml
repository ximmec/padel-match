name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: padel
          POSTGRES_PASSWORD: padel
          POSTGRES_DB: padel_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U padel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://padel:padel@localhost:5432/padel_test
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Verificar tipos (TypeScript)
        run: npx tsc --noEmit 2>&1 | tee -a ci-output.txt; exit ${PIPESTATUS[0]}
      - name: Pruebas de la lógica de dominio
        run: npm test 2>&1 | tee -a ci-output.txt; exit ${PIPESTATUS[0]}
      - name: Migraciones de base de datos
        run: npm run migrate 2>&1 | tee -a ci-output.txt; exit ${PIPESTATUS[0]}
      - name: Pruebas de integración con PostgreSQL
        run: npm run test:db 2>&1 | tee -a ci-output.txt; exit ${PIPESTATUS[0]}
      - name: Compilar la aplicación (Next.js)
        run: npm run build:app 2>&1 | tee -a ci-output.txt; exit ${PIPESTATUS[0]}
      - name: Prueba de humo (servidor real)
        run: |
          npx next start -p 3000 >> ci-output.txt 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/api/health && break; sleep 1; done
          curl -sf http://localhost:3000/api/health
          curl -sf -o /dev/null -w "home %{http_code}\n" http://localhost:3000/
          curl -s -o /dev/null -w "setup %{http_code}\n" http://localhost:3000/setup
          curl -s -o /dev/null -w "admin %{http_code}\n" http://localhost:3000/admin
          code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/)
          for p in / /setup /login /buscar /ranking /api/public/version?t=00000000-0000-0000-0000-000000000000; do echo "$p $(curl -s -o /dev/null -w "%{http_code}" "http://localhost:3000$p")" | tee -a ci-output.txt; done
          test "$code" = "200"
      - name: Publicar resumen del error
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### CI falló en ${GITHUB_SHA::7}"
            echo '```'
            grep -E "error|Error|not ok|fail|✖|Failed|Type error" ci-output.txt | grep -v "node_modules" | head -150
            echo '...'
            tail -n 80 ci-output.txt
            echo '```'
          } > comment.md
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" -F body=@comment.md > /dev/null
